# Usado só para gerar novas migrações em desenvolvimento:
#   uv run alembic revision --autogenerate -m "descricao"
# Em execução normal o app aplica as migrações sozinho no startup.
[alembic]
script_location = src/wledadmin/migrations
sqlalchemy.url = sqlite:///data/wledadmin.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
